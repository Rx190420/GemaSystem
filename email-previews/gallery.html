<title>Correos de GemaSystem</title>
<style>
  :root{
    --bg:#f4f2fa; --bg-grid:#eae6f5; --panel:#ffffff; --panel-border:#e6e1f2;
    --ink:#1c1a27; --muted:#6b6678; --faint:#a39cb0;
    --accent1:#4F46E5; --accent2:#7C3AED;
    --item-hover: rgba(79,70,229,0.07); --item-active: rgba(79,70,229,0.12);
    --shell-shadow: 0 24px 60px -30px rgba(79,70,229,0.30), 0 2px 8px rgba(28,26,39,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141220; --bg-grid:#1c1830; --panel:#1c1930; --panel-border:#2c2745;
      --ink:#f1eef8; --muted:#a79fc0; --faint:#6d6484;
      --item-hover: rgba(124,88,237,0.14); --item-active: rgba(124,88,237,0.22);
      --shell-shadow: 0 24px 60px -25px rgba(124,58,237,0.45), 0 2px 8px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141220; --bg-grid:#1c1830; --panel:#1c1930; --panel-border:#2c2745;
    --ink:#f1eef8; --muted:#a79fc0; --faint:#6d6484;
    --item-hover: rgba(124,88,237,0.14); --item-active: rgba(124,88,237,0.22);
    --shell-shadow: 0 24px 60px -25px rgba(124,58,237,0.45), 0 2px 8px rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; }
  body{
    background:
      radial-gradient(circle at 1px 1px, var(--bg-grid) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    min-height:100vh;
  }

  .page{ max-width:1100px; margin:0 auto; padding:40px 20px 60px; }
  .page-head{ text-align:center; margin-bottom:28px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:7px;
    font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--accent1); background:color-mix(in srgb, var(--accent1) 10%, transparent);
    border:1px solid color-mix(in srgb, var(--accent1) 22%, transparent);
    padding:5px 12px; border-radius:99px; margin-bottom:16px;
  }
  .dot{ width:6px; height:6px; border-radius:50%; background:linear-gradient(135deg,var(--accent1),var(--accent2)); flex:none; }
  .page-title{ font-size:26px; font-weight:800; letter-spacing:-0.4px; margin:0 0 8px; text-wrap:balance; }
  .page-sub{ font-size:14px; color:var(--muted); max-width:56ch; margin:0 auto; line-height:1.6; }

  .shell{
    display:grid; grid-template-columns:250px 1fr; gap:0;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:18px;
    box-shadow:var(--shell-shadow); overflow:hidden; min-height:640px;
  }
  .sidebar{
    border-right:1px solid var(--panel-border); padding:14px 10px; overflow-y:auto; max-height:82vh;
  }
  .group-label{
    font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    color:var(--faint); padding:14px 10px 6px;
  }
  .group-label:first-child{ padding-top:4px; }
  .item{
    display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
    padding:9px 10px; border-radius:9px; font-size:13px; color:var(--ink); font-weight:600;
    margin-bottom:2px;
  }
  .item:hover{ background:var(--item-hover); }
  .item.active{ background:var(--item-active); color:var(--accent1); }

  .viewer{ background:#eceaf3; padding:22px; overflow:hidden; display:flex; flex-direction:column; }
  .frame-chrome{ display:flex; align-items:center; gap:6px; padding:2px 4px 14px; flex:none; }
  .frame-dot{ width:9px; height:9px; border-radius:50%; }
  .frame-dot.r{ background:#f87171; } .frame-dot.y{ background:#fbbf24; } .frame-dot.g{ background:#34d399; }
  .frame-subject{ margin-left:10px; font-size:12px; color:#75717f; font-weight:600; }
  .email-scroll{ flex:1; overflow-y:auto; border-radius:12px; background:#fff; }

  /* the embedded email markup below keeps its own fixed, light-only styling —
     it renders identically to a real inbox regardless of page theme */


/* ===== per-template email CSS (deduped by id at render time) ===== */

</style>
<div class="page">
  <div class="page-head">
    <span class="eyebrow"><span class="dot"></span>Vista previa en vivo</span>
    <h1 class="page-title">Correos de GemaSystem</h1>
    <p class="page-sub">Las 13 plantillas con el rediseño aplicado, renderizadas con datos de prueba. Imagenes incrustadas: no dependen de tu servidor local.</p>
  </div>

  <div class="shell">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="viewer">
      <div class="frame-chrome">
        <span class="frame-dot r"></span><span class="frame-dot y"></span><span class="frame-dot g"></span>
        <span class="frame-subject" id="subject">&nbsp;</span>
      </div>
      <div class="email-scroll" id="emailHost"></div>
    </div>
  </div>
</div>

n    .box-label { font-size:10px; font-weight:700; color:#a1a1aa; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }\n    .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:13px; }\n    .row:last-child { border-bottom:none; padding-bottom:0; }\n    .rk { color:#71717a; }\n    .rv { font-weight:600; color:#09090b; text-align:right; }\n    /* ── Code ── */\n    .code-box { background:linear-gradient(135deg,#eef2ff,#f5f3ff); border:1px solid #e0e7ff; border-radius:10px; padding:26px; text-align:center; margin-bottom:20px; }\n    .code { font-size:36px; font-weight:800; color:#4338ca; letter-spacing:5px; font-family:'Courier New',monospace; }\n    .code-hint { font-size:12px; color:#a1a1aa; margin-top:10px; }\n    /* ── Notices ── */\n    .notice { border-left:3px solid #e4e4e7; padding:12px 16px; margin-bottom:20px; border-radius:0 4px 4px 0; background:#fafafa; }\n    .notice p,.notice-text { font-size:13px; line-height:1.65; color:#52525b; }\n    .notice.blue   { border-color:#6366f1; background:#f5f3ff; }\n    .notice.green  { border-color:#22c55e; background:#f0fdf4; }\n    .notice.amber  { border-color:#f59e0b; background:#fffbeb; }\n    .notice.red    { border-color:#ef4444; background:#fef2f2; }\n    /* ── Pill badges ── */\n    .pill { display:inline-block; padding:2px 9px; border-radius:4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }\n    .pill-basic   { background:#f5f3ff; color:#7c3aed; border:1px solid #ddd6fe; }\n    .pill-premium { background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; }\n    .pill-vip     { background:#fffbeb; color:#d97706; border:1px solid #fde68a; }\n    .pill-green   { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }\n    .pill-red     { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }\n    .pill-icon    { width:12px; height:12px; vertical-align:-2px; margin-right:1p lay:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(79,70,229,0.3); }\n    .nav-name { font-size:14.5px; font-weight:800; color:#09090b; letter-spacing:-0.3px; }\n    /* ── Body ── */\n    .body { padding:32px 24px; }\n    .eyebrow { font-size:11px; font-weight:700; color:#6366f1; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:8px; }\n    .h1 { font-size:22px; font-weight:700; color:#09090b; line-height:1.3; margin-bottom:10px; }\n    .lead { font-size:14px; color:#52525b; line-height:1.7; margin-bottom:24px; }\n    /* ── Info box ── */\n    .box { background:#fafafa; border:1px solid #e4e4e7; border-radius:6px; padding:18px 20px; margin-bottom:20px; }\n    .box-label { font-size:10px; font-weight:700; color:#a1a1aa; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }\n    .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:13px; }\n    .row:last-child { border-bottom:none; padding-bottom:0; }\n    .rk { color:#71717a; }\n    .rv { font-weight:600; color:#09090b; text-align:right; }\n    /* ── Code ── */\n    .code-box { background:linear-gradient(135deg,#eef2ff,#f5f3ff); border:1px solid #e0e7ff; border-radius:10px; padding:26px; text-align:center; margin-bottom:20px; }\n    .code { font-size:36px; font-weight:800; color:#4338ca; letter-spacing:5px; font-family:'Courier New',monospace; }\n    .code-hint { font-size:12px; color:#a1a1aa; margin-top:10px; }\n    /* ── Notices ── */\n    .notice { border-left:3px solid #e4e4e7; padding:12px 16px; margin-bottom:20px; border-radius:0 4px 4px 0; background:#fafafa; }\n    .notice p,.notice-text { font-size:13px; line-height:1.65; color:#52525b; }\n    .notice.blue   { border-color:#6366f1; background:#f5f3ff; }\n    .notice.green  { border-color:#22c55e; background:#f0fdf4; }\n    .notice.amber  { border-color:#f59e0b; background:#fffbeb; }\n    .notice.red    { border-color:#ef4444; background:#fef2f2; }\n    /* ── Pill badges ── */\n    .pill { display:inline-block; padding:2px 9px; border-radius:4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }\n    .pill-basic   { background:#f5f3ff; color:#7c3aed; border:1px solid #ddd6fe; }\n    .pill-premium { background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; }\n    .pill-vip     { background:#fffbeb; color:#d97706; border:1px solid #fde68a; }\n    .pill-green   { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }\n    .pill-red     { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }\n    .pill-icon    { width:12px; height:12px; vertical-align:-2px; margin-right:1px; }\n    /* ── Icon badge (hero icon at the top of every email) ──\n       line-height + vertical-align:middle centers the icon even in clients\n       that ignore flexbox; inline-flex centers it properly everywhere else. */\n    .hero { text-align:center; margin-bottom:22px; }\n    .icon-badge {\n      width:60px; height:60px; line-height:60px; text-align:center; border-radius:50%;\n      margin:0 auto 16px; display:inline-flex; align-items:center; justify-content:center;\n      box-shadow:0 0 0 6px rgba(24,24,27,0.03);\n    }\n    .icon-badge img { display:inline-block; vertical-align:middle; }\n    .icon-badge-green  { background:#f0fdf4; box-shadow:0 0 0 6px rgba(34,197,94,0.06); }\n    .icon-badge-red    { background:#fef2f2; box-shadow:0 0 0 6px rgba(239,68,68,0.06); }\n    .icon-badge-amber  { background:#fffbeb; box-shadow:0 0 0 6px rgba(245,158,11,0.08); }\n    .icon-badge-indigo { background:#eef2ff; box-shadow:0 0 0 6px rgba(99,102,241,0.08); }\n    .icon-badge-purple { background:#faf5ff; box-shadow:0 0 0 6px rgba(124,58,237,0.08); }\n    .icon-badge-gray   { background:#f4f4f5; }\n    .hero .h1 { margin-bottom:0; }\n    /* ── Misc ── */\n    hr { border:none; border-top:1px solid #f4f4f5; margin:20px 0; }\n    .btn { display:block; background:#09090b; color:#fff!important; text-decoration:none; padding:13px 20px; border-radius:6px; font-size:14px; font-weight:600; text-align:center; margin-bottom:20px; }\n    .btn-indigo { background:#6366f1; }\n    .qr-wrap { display:inline-block; padding:12px; background:#fff; border:1px solid #e0e7ff; border-radius:10px; box-shadow:0 2px 10px rgba(79,70,229,0.08); }\n    /* ── Footer ── */\n    .footer { padding:16px 24px; border-top:1px solid #f4f4f5; }\n    .footer p { font-size:11px; color:#a1a1aa; text-align:center; line-height:1.7; }\n\n    /* ── Mobile ──\n       .code was the worst offender: 44px + 10px letter-spacing on an 8-char\n       code (e.g. \"FIT-0001\") runs past a ~340px content width on a phone,\n       forcing horizontal scroll inside the email. .row also needs to wrap\n       instead of squeezing a long value (email addresses especially)\n       against its label on one line. Gmail's Android/iOS apps and Apple\n       Mail both apply <style> media queries fine — only some Outlook\n       desktop builds ignore them, and this app's mail is 100% consumer\n       inboxes, not corporate Outlook. */\n    @media  screen and (max-width: 480px) {\n      .wrap { margin:20px auto; padding:0 12px 28px; }\n      .nav { padding:14px 16px; }\n      .body { padding:24px 16px; }\n      .h1 { font-size:19px; }\n      .lead { font-size:13.5px; }\n      .box { padding:16px; }\n      .code-box { padding:18px 12px; }\n      .code { font-size:24px; letter-spacing:3px; }\n      .row { flex-wrap:wrap; row-gap:2px; }\n      .rv { text-align:left; width:100%; }\n      .icon-badge { width:48px; height:48px; line-height:48px; }\n    }\n  ", "body": "\n  <div class=\"wrap\">\n    <div class=\"card\">\n      <div class=\"card-bar\"></div>\n\n      <div class=\"nav\">\n        <div class=\"nav-icon\">\n          \n          <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAS4AAAGACAYAAAATVo/dAAAQAElEQVR4nOzdeZBlZXnA4bcJYBAUt0ERFVRUlE0Ro4jBCCWLCxrcARVTJpYmRhNR0IomGrdUVDSkXOKKMSESNLiG px; background:linear-gradient(90deg,#4F46E5,#7C3AED); }\n    /* ── Nav ── */\n    .nav { padding:20px 24px; border-bottom:1px solid #f4f4f5; display:flex; align-items:center; gap:9px; }\n    .nav-icon { width:22px; height:22px; background:linear-gradient(135deg,#4F46E5,#7C3AED); border-radius:6px; padding:3px 5px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(79,70,229,0.3); }\n    .nav-name { font-size:14.5px; font-weight:800; color:#09090b; letter-spacing:-0.3px; }\n    /* ── Body ── */\n    .body { padding:32px 24px; }\n    .eyebrow { font-size:11px; font-weight:700; color:#6366f1; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:8px; }\n    .h1 { font-size:22px; font-weight:700; color:#09090b; line-height:1.3; margin-bottom:10px; }\n    .lead { font-size:14px; color:#52525b; line-height:1.7; margin-bottom:24px; }\n    /* ── Info box ── */\n    .box { background:#fafafa; border:1px solid #e4e4e7; border-radius:6px; padding:18px 20px; margin-bottom:20px; }\n    .box-label { font-size:10px; font-weight:700; color:#a1a1aa; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }\n    .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:13px; }\n    .row:last-child { border-bottom:none; padding-bottom:0; }\n    .rk { color:#71717a; }\n    .rv { font-weight:600; color:#09090b; text-align:right; }\n    /* ── Code ── */\n    .code-box { background:linear-gradient(135deg,#eef2ff,#f5f3ff); border:1px solid #e0e7ff; border-radius:10px; padding:26px; text-align:center; margin-bottom:20px; }\n    .code { font-size:36px; font-weight:800; color:#4338ca; letter-spacing:5px; font-family:'Courier New',monospace; }\n    .code-hint { font-size:12px; color:#a1a1aa; margin-top:10px; }\n    /* ── Notices ── */\n    .notice { border-left:3px solid #e4e4e7; padding:12px 16px; margin-bottom:20px; border-radius:0 4px 4px 0; background:#fafafa; }\n    .notice p,.notice-text { font-size:13px; line-height:1.65; color:#52525b; }\n    .notice.blue   { border-color:#6366f1; background:#f5f3ff; }\n    .notice.green  { border-color:#22c55e; background:#f0fdf4; }\n    .notice.amber  { border-color:#f59e0b; background:#fffbeb; }\n    .notice.red    { border-color:#ef4444; background:#fef2f2; }\n    /* ── Pill badges ── */\n    .pill { display:inline-block; padding:2px 9px; border-radius:4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }\n    .pill-basic   { background:#f5f3ff; color:#7c3aed; border:1px solid #ddd6fe; }\n    .pill-premium { background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; }\n    .pill-vip     { background:#fffbeb; color:#d97706; border:1px solid #fde68a; }\n    .pill-green   { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }\n    .pill-red     { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }\n    .pill-icon    { width:12px; height:12px; vertical-align:-2px; margin-right:1px; }\n    /* ── Icon badge (hero icon at the top of every email) ──\n       line-height + vertical-align:middle centers the icon even in clients\n       that ignore flexbox; inline-flex centers it properly everywhere else. */\n    .hero { text-align:center; margin-bottom:22px; }\n    .icon-badge {\n      width:60px; height:60px; line-height:60px; text-align:center; border-radius:50%;\n      margin:0 auto 16px; display:inline-flex; align-items:center; justify-content:center;\n      box-shadow:0 0 0 6px rgba(24,24,27,0.03);\n    }\n    .icon-badge img { display:inline-block; vertical-align:middle; }\n    .icon-badge-green  { background:#f0fdf4; box-shadow:0 0 0 6px rgba(34,197,94,0.06); }\n    .icon-badge-red    { background:#fef2f2; box-shadow:0 0 0 6px rgba(239,68,68,0.06); }\n    .icon-badge-amber  { background:#fffbeb; box-shadow:0 0 0 6px rgba(245,158,11,0.08); }\n    .icon-badge-indigo { background:#eef2ff; box-shadow:0 0 0 6px rgba(99,102,241,0.08); }\n    .icon-badge-purple { background:#faf5ff; box-shadow:0 0 0 6px rgba(124,58,237,0.08); }\n    .icon-badge-gray   { background:#f4f4f5; }\n    .hero .h1 { margin-bottom:0; }\n    /* ── Misc ── */\n    hr { border:none; border-top:1px solid #f4f4f5; margin:20px 0; }\n    .btn { display:block; background:#09090b; color:#fff!important; text-decoration:none; padding:13px 20px; border-radius:6px; font-size:14px; font-weight:600; text-align:center; margin-bottom:20px; }\n    .btn-indigo { background:#6366f1; }\n    .qr-wrap { display:inline-block; padding:12px; background:#fff; border:1px solid #e0e7ff; border-radius:10px; box-shadow:0 2px 10px rgba(79,70,229,0.08); }\n    /* ── Footer ── */\n    .footer { padding:16px 24px; border-top:1px solid #f4f4f5; }\n    .footer p { font-size:11px; color:#a1a1aa; text-align:center; line-height:1.7; }\n\n    /* ── Mobile ──\n       .code was the worst offender: 44px + 10px letter-spacing on an 8-char\n       code (e.g. \"FIT-0001\") runs past a ~340px content width on a phone,\n       forcing horizontal scroll inside the email. .row also needs to wrap\n       instead of squeezing a long value (email addresses especially)\n       against its label on one line. Gmail's Android/iOS apps and Apple\n       Mail both apply <style> media queries fine — only some Outlook\n       desktop builds ignore them, and this app's mail is 100% consumer\n       inboxes, not corporate Outlook. */\n    @media  screen and (max-width: 480px) {\n      .wrap { margin:20px auto; padding:0 12px 28px; }\n      .nav { padding:14px 16px; }\n      .body { padding:24px 16px; }\n      .h1 { font-size:19px; }\n      .lead { font-size:13.5px; }\n      .box { padding:16px; }\n      .code-box { padding:18px 12px; }\n      .code { font-size:24px; letter-spacing:3px; }\n      .row { flex-wrap:wrap; row-gap:2px; }\n      .rv { text-align:left; width:100%; }\n      .icon-badge { width:48px; height:48px; line-height:48px; }\n    }\n  ", "body": " class=\"h1\">\n              Recordatorio de membresía\n          </h1>\n  </div>\n  <p class=\"lead\">\n          Este es un recordatorio sobre el estado de tu membresía.\n      </p>\n\n  \n  <div class=\"code-box\">\n    <div style=\"font-size:10px;font-weight:700;color:#a1a1aa;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;\">Días restantes</div>\n    <div style=\"font-size:56px;font-weight:900;line-height:1;color:#6366f1;\">12</div>\n    <div style=\"font-size:13px;color:#71717a;margin-top:6px;\">días restantes</div>\n  </div>\n\n  <div class=\"box\">\n    <div class=\"box-label\">Detalles</div>\n    <div class=\"row\">\n      <span class=\"rk\">Miembro</span>\n      <span class=\"rv\">Bryant Ramírez</span>\n    </div>\n    <div class=\"row\">\n      <span class=\"rk\">ID de miembro</span>\n      <span class=\"rv\" style=\"font-family:'Courier New',monospace;\">FIT-0019</span>\n    </div>\n    <div class=\"row\">\n      <span class=\"rk\">Fecha de vencimiento</span>\n      <span class=\"rv\">15/09/2026</span>\n    </div>\n        <div class=\"row\">\n      <span class=\"rk\">Plan activo</span>\n      <span class=\"rv\"><span class=\"pill pill-premium\">PREMIUM</span></span>\n    </div>\n      </div>\n\n  <div class=\"notice blue\">\n    <p class=\"notice-text\">\n              Recuerda que puedes renovar en cualquier momento en recepción con tu ID <strong>FIT-0019</strong>.\n          </p>\n  </div>\n      </div>\n\n      <div class=\"footer\">\n        <p>© 2026 GemaSystem &middot; Correo automático, no respondas a este mensaje.</p>\n              </div>\n\n    </div>\n  </div>\n"}, {"id": "membership_reminder_urgent", "label": "Recordatorio (urgente)", "group": "Miembros", "style": "\n    * { margin:0; padding:0; box-sizing:border-box; }\n    body { background:#f4f4f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; color:#09090b; -webkit-font-smoothing:antialiased; }\n    .wrap { max-width:560px; margin:40px auto; padding:0 20px 40px; }\n    .card { background:#fff; border:1px solid #e4e4e7; border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(24,24,27,0.04), 0 12px 32px -12px rgba(79,70,229,0.18); }\n    .card-bar { height:4px; background:linear-gradient(90deg,#4F46E5,#7C3AED); }\n    /* ── Nav ── */\n    .nav { padding:20px 24px; border-bottom:1px solid #f4f4f5; display:flex; align-items:center; gap:9px; }\n    .nav-icon { width:22px; height:22px; background:linear-gradient(135deg,#4F46E5,#7C3AED); border-radius:6px; padding:3px 5px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(79,70,229,0.3); }\n    .nav-name { font-size:14.5px; font-weight:800; color:#09090b; letter-spacing:-0.3px; }\n    /* ── Body ── */\n    .body { padding:32px 24px; }\n    .eyebrow { font-size:11px; font-weight:700; color:#6366f1; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:8px; }\n    .h1 { font-size:22px; font-weight:700; color:#09090b; line-height:1.3; margin-bottom:10px; }\n    .lead { font-size:14px; color:#52525b; line-height:1.7; margin-bottom:24px; }\n    /* ── Info box ── */\n    .box { background:#fafafa; border:1px solid #e4e4e7; border-radius:6px; padding:18px 20px; margin-bottom:20px; }\n    .box-label { font-size:10px; font-weight:700; color:#a1a1aa; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }\n    .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:13px; }\n    .row:last-child { border-bottom:none; padding-bottom:0; }\n    .rk { color:#71717a; }\n    .rv { font-weight:600; color:#09090b; text-align:right; }\n    /* ── Code ── */\n    .code-box { background:linear-gradient(135deg,#eef2ff,#f5f3ff); border:1px solid #e0e7ff; border-radius:10px; padding:26px; text-align:center; margin-bottom:20px; }\n    .code { font-size:36px; font-weight:800; color:#4338ca; letter-spacing:5px; font-family:'Courier New',monospace; }\n    .code-hint { font-size:12px; color:#a1a1aa; margin-top:10px; }\n    /* ── Notices ── */\n    .notice { border-left:3px solid #e4e4e7; padding:12px 16px; margin-bottom:20px; border-radius:0 4px 4px 0; background:#fafafa; }\n    .notice p,.notice-text { font-size:13px; line-height:1.65; color:#52525b; }\n    .notice.blue   { border-color:#6366f1; background:#f5f3ff; }\n    .notice.green  { border-color:#22c55e; background:#f0fdf4; }\n    .notice.amber  { border-color:#f59e0b; background:#fffbeb; }\n    .notice.red    { border-color:#ef4444; background:#fef2f2; }\n    /* ── Pill badges ── */\n    .pill { display:inline-block; padding:2px 9px; border-radius:4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }\n    .pill-basic   { background:#f5f3ff; color:#7c3aed; border:1px solid #ddd6fe; }\n    .pill-premium { background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; }\n    .pill-vip     { background:#fffbeb; color:#d97706; border:1px solid #fde68a; }\n    .pill-green   { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }\n    .pill-red     { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }\n    .pill-icon    { width:12px; height:12px; vertical-align:-2px; margin-right:1px; }\n    /* ── Icon badge (hero icon at the top of every email) ──\n       line-height + vertical-align:middle centers the icon even in clients\n       that ignore flexbox; inline-flex centers it properly everywhere else. */\n    .hero { text-align:center; margin-bottom:22px; }\n    .icon-badge {\n      width:60px; height:60px; line-height:60px; text-align:center; border-radius:50%;\n      margin:0 auto 16px; display:inline-flex; align-items:center; justify-content:center;\n      box-shadow:0 0 0 6px rgba(24,24,27,0.03);\n    }\n    .icon-badge img { display:inline-block; vertical-align:middle; }\n    .icon-badge-green  { background:#f0fdf4; box-shadow:0 0 0 6px rgba(34,197,94,0.06); }\n    .icon-badge-red    { background:#fef2f2; box-shadow:0 0 0 6px rgba(239,68,68,0.06); }\n    .icon-badge-amber  { background:#fffbeb; box-shadow:0 0 0 6px rgba(245,158,11,0.08); }\n    .icon-badge-indigo { background:#eef2ff; box-shadow:0 0 0 6px rgba(99,102,241,0.08); }\n    .icon-badge-purple { background:#faf5ff; box-shadow:0 0 0 6px rgba(124,58,237,0.08); }\n    .icon-badge-gray   { background:#f4f4f5; }\n    .hero .h1 { margin-bottom:0; }\n    /* ── Misc ── */\n    hr { border:none; border-top:1px solid #f4f4f5; margin:20px 0; }\n    .btn { display:block; background:#09090b; color:#fff!important; text-decoration:none; padding:13px 20px; border-radius:6px; font-size:14px; font-weight:600; text-align:center; margin-bottom:20px; }\n    .btn-indigo { background:#6366f1; }\n    .qr-wrap { display:inline-block; padding:12px; background:#fff; border:1px solid #e0e7ff; border-radius:10px; box-shadow:0 2px 10px rgba(79,70,229,0.08); }\n    /* ── Footer ── */\n    .footer { padding:16px 24px; border-top:1px solid #f4f4f5; }\n    .footer p { font-size:11px; color:#a1a1aa; text-align:center; line-height:1.7; }\n\n    /* ── Mobile ──\n       .code was the worst offender: 44px + 10px letter-spacing on an 8-char\n       code (e.g. \"FIT-0001\") runs past a ~340px content width on a phone,\n       forcing horizontal scroll inside the email. .row also needs to wrap\n       instead of squeezing a long value (email addresses especially)\n       against its label on one line. Gmail's Android/iOS apps and Apple\n       Mail both apply <style> media queries fine — only some Outlook\n       desktop builds ignore them, and this app's mail is 100% consumer\n       inboxes, not corporate Outlook. */\n    @media  screen and (max-width: 480px) {\n      .wrap { margin:20px auto; padding:0 12px 28px; }\n      .nav { padding:14px 16px; }\n      .body { padding:24px 16px; }\n      .h1 { font-size:19px; }\n      .lead { font-size:13.5px; }\n      .box { padding:16px; }\n      .code-box { padding:18px 12px; 4f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; color:#09090b; -webkit-font-smoothing:antialiased; }\n    .wrap { max-width:560px; margin:40px auto; padding:0 20px 40px; }\n    .card { background:#fff; border:1px solid #e4e4e7; border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(24,24,27,0.04), 0 12px 32px -12px rgba(79,70,229,0.18); }\n    .card-bar { height:4px; background:linear-gradient(90deg,#4F46E5,#7C3AED); }\n    /* ── Nav ── */\n    .nav { padding:20px 24px; border-bottom:1px solid #f4f4f5; display:flex; align-items:center; gap:9px; }\n    .nav-icon { width:22px; height:22px; background:linear-gradient(135deg,#4F46E5,#7C3AED); border-radius:6px; padding:3px 5px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(79,70,229,0.3); }\n    .nav-name { font-size:14.5px; font-weight:800; color:#09090b; letter-spacing:-0.3px; }\n    /* ── Body ── */\n    .body { padding:32px 24px; }\n    .eyebrow { font-size:11px; font-weight:700; color:#6366f1; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:8px; }\n    .h1 { font-size:22px; font-weight:700; color:#09090b; line-height:1.3; margin-bottom:10px; }\n    .lead { font-size:14px; color:#52525b; line-height:1.7; margin-bottom:24px; }\n    /* ── Info box ── */\n    .box { background:#fafafa; border:1px solid #e4e4e7; border-radius:6px; padding:18px 20px; margin-bottom:20px; }\n    .box-label { font-size:10px; font-weight:700; color:#a1a1aa; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }\n    .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:13px; }\n    .row:last-child { border-bottom:none; padding-bottom:0; }\n    .rk { color:#71717a; }\n    .rv { font-weight:600; color:#09090b; text-align:right; }\n    /* ── Code ── */\n    .code-box { background:linear-gradient(135deg,#eef2ff,#f5f3ff); border:1px solid #e0e7ff; border-radius:10px; padding:26px; text-align:center; margin-bottom:20px; }\n    .code { font-size:36px; font-weight:800; color:#4338ca; letter-spacing:5px; font-family:'Courier New',monospace; }\n    .code-hint { font-size:12px; color:#a1a1aa; margin-top:10px; }\n    /* ── Notices ── */\n    .notice { border-left:3px solid #e4e4e7; padding:12px 16px; margin-bottom:20px; border-radius:0 4px 4px 0; background:#fafafa; }\n    .notice p,.notice-text { font-size:13px; line-height:1.65; color:#52525b; }\n    .notice.blue   { border-color:#6366f1; background:#f5f3ff; }\n    .notice.green  { border-color:#22c55e; background:#f0fdf4; }\n    .notice.amber  { border-color:#f59e0b; background:#fffbeb; }\n    .notice.red    { border-color:#ef4444; background:#fef2f2; }\n    /* ── Pill badges ── */\n    .pill { display:inline-block; padding:2px 9px; border-radius:4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }\n    .pill-basic   { background:#f5f3ff; color:#7c3aed; border:1px solid #ddd6fe; }\n    .pill-premium { background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; }\n    .pill-vip     { background:#fffbeb; color:#d97706; border:1px solid #fde68a; }\n    .pill-green   { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }\n    .pill-red     { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }\n    .pill-icon    { width:12px; height:12px; vertical-align:-2px; margin-right:1px; }\n    /* ── Icon badge (hero icon at the top of every email) ──\n       line-height + vertical-align:middle centers the icon even in clients\n       that ignore flexbox; inline-flex centers it properly everywhere else. */\n    .hero { text-align:center; margin-bottom:22px; }\n    .icon-badge {\n      width:60px; height:60px; line-height:60px; text-align:center; border-radius:50%;\n      margin:0 auto 16px; display:inline-flex; align-items:center; justify-content:center;\n      box-shadow:0 0 0 6px rgba(24,24,27,0.03);\n    }\n    .icon-badge img { display:inline-block; vertical-align:middle; }\n    .icon-badge-green  { background:#f0fdf4; box-shadow:0 0 0 6px rgba(34,197,94,0.06); }\n    .icon-badge-red    { background:#fef2f2; box-shadow:0 0 0 6px rgba(239,68,68,0.06); }\n    .icon-badge-amber  { background:#fffbeb; box-shadow:0 0 0 6px rgba(245,158,11,0.08); }\n    .icon-badge-indigo { background:#eef2ff; box-shadow:0 0 0 6px rgba(99,102,241,0.08); }\n    .icon-badge-purple { background:#faf5ff; box-shadow:0 0 0 6px rgba(124,58,237,0.08); }\n    .icon-badge-gray   { background:#f4f4f5; }\n    .hero .h1 { margin-bottom:0; }\n    /* ── Misc ── */\n    hr { border:none; border-top:1px solid #f4f4f5; margin:20px 0; }\n    .btn { display:block; background:#09090b; color:#fff!important; text-decoration:none; padding:13px 20px; border-radius:6px; font-size:14px; font-weight:600; text-align:center; margin-bottom:20px; }\n    .btn-indigo { background:#6366f1; }\n    .qr-wrap { display:inline-block; padding:12px; background:#fff; border:1px solid #e0e7ff; border-radius:10px; box-shadow:0 2px 10px rgba(79,70,229,0.08); }\n    /* ── Footer ── */\n    .footer { padding:16px 24px; border-top:1px solid #f4f4f5; }\n    .footer p { font-size:11px; color:#a1a1aa; text-align:center; line-height:1.7; }\n\n    /* ── Mobile ──\n       .code was the worst offender: 44px + 10px letter-spacing on an 8-char\n       code (e.g. \"FIT-0001\") runs past a ~340px content width on a phone,\n       forcing horizontal scroll inside the email. .row also needs to wrap\n       instead of squeezing a long value (email addresses especially)\n       against its label on one line. Gmail's Android/iOS apps and Apple\n       Mail both apply <style> media queries fine — only some Outlook\n       desktop builds ignore them, and this app's mail is 100% consumer\n       inboxes, not corporate Outlook. */\n    @media  screen and (max-width: 480px) {\n      .wrap { margin:20px auto; padding:0 12px 28px; }\n      .nav { padding: a <strong>cambiar la contraseña</strong> de tu cuenta. Usa el siguiente código para confirmar que eres tú.\n      </p>\n\n  <div class=\"code-box\">\n    <div style=\"font-size:10px;font-weight:700;color:#a1a1aa;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px;\">Código de verificación</div>\n    <div class=\"code\">731045</div>\n    <div class=\"code-hint\">Válido por 15 minutos</div>\n  </div>\n\n  <div class=\"notice amber\">\n    <p class=\"notice-text\">Si no realizaste esta solicitud, ignora este correo. <strong>Tu contraseña no cambiará.</strong></p>\n  </div>\n      </div>\n\n      <div class=\"footer\">\n        <p>© 2026 GemaSystem &middot; Correo automático, no respondas a este mensaje.</p>\n              </div>\n\n    </div>\n  </div>\n"}, {"id": "password-reset-code_reset", "label": "Código — recuperar contraseña", "group": "Cuenta", "style": "\n    * { margin:0; padding:0; box-sizing:border-box; }\n    body { background:#f4f4f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; color:#09090b; -webkit-font-smoothing:antialiased; }\n    .wrap { max-width:560px; margin:40px auto; padding:0 20px 40px; }\n    .card { background:#fff; border:1px solid #e4e4e7; border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(24,24,27,0.04), 0 12px 32px -12px rgba(79,70,229,0.18); }\n    .card-bar { height:4px; background:linear-gradient(90deg,#4F46E5,#7C3AED); }\n    /* ── Nav ── */\n    .nav { padding:20px 24px; border-bottom:1px solid #f4f4f5; display:flex; align-items:center; gap:9px; }\n    .nav-icon { width:22px; height:22px; background:linear-gradient(135deg,#4F46E5,#7C3AED); border-radius:6px; padding:3px 5px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(79,70,229,0.3); }\n    .nav-name { font-size:14.5px; font-weight:800; color:#09090b; letter-spacing:-0.3px; }\n    /* ── Body ── */\n    .body { padding:32px 24px; }\n    .eyebrow { font-size:11px; font-weight:700; color:#6366f1; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:8px; }\n    .h1 { font-size:22px; font-weight:700; color:#09090b; line-height:1.3; margin-bottom:10px; }\n    .lead { font-size:14px; color:#52525b; line-height:1.7; margin-bottom:24px; }\n    /* ── Info box ── */\n    .box { background:#fafafa; border:1px solid #e4e4e7; border-radius:6px; padding:18px 20px; margin-bottom:20px; }\n    .box-label { font-size:10px; font-weight:700; color:#a1a1aa; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }\n    .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:13px; }\n    .row:last-child { border-bottom:none; padding-bottom:0; }\n    .rk { color:#71717a; }\n    .rv { font-weight:600; color:#09090b; text-align:right; }\n    /* ── Code ── */\n    .code-box { background:linear-gradient(135deg,#eef2ff,#f5f3ff); border:1px solid #e0e7ff; border-radius:10px; padding:26px; text-align:center; margin-bottom:20px; }\n    .code { font-size:36px; font-weight:800; color:#4338ca; letter-spacing:5px; font-family:'Courier New',monospace; }\n    .code-hint { font-size:12px; color:#a1a1aa; margin-top:10px; }\n    /* ── Notices ── */\n    .notice { border-left:3px solid #e4e4e7; padding:12px 16px; margin-bottom:20px; border-radius:0 4px 4px 0; background:#fafafa; }\n    .notice p,.notice-text { font-size:13px; line-height:1.65; color:#52525b; }\n    .notice.blue   { border-color:#6366f1; background:#f5f3ff; }\n    .notice.green  { border-color:#22c55e; background:#f0fdf4; }\n    .notice.amber  { border-color:#f59e0b; background:#fffbeb; }\n    .notice.red    { border-color:#ef4444; background:#fef2f2; }\n    /* ── Pill badges ── */\n    .pill { display:inline-block; padding:2px 9px; border-radius:4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }\n    .pill-basic   { background:#f5f3ff; color:#7c3aed; border:1px solid #ddd6fe; }\n    .pill-premium { background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; }\n    .pill-vip     { background:#fffbeb; color:#d97706; border:1px solid #fde68a; }\n    .pill-green   { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }\n    .pill-red     { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }\n    .pill-icon    { width:12px; height:12px; vertical-align:-2px; margin-right:1px; }\n    /* ── Icon badge (hero icon at the top of every email) ──\n       line-height + vertical-align:middle centers the icon even in clients\n       that ignore flexbox; inline-flex centers it properly everywhere else. */\n    .hero { text-align:center; margin-bottom:22px; }\n    .icon-badge {\n      width:60px; height:60px; line-height:60px; text-align:center; border-radius:50%;\n      margin:0 auto 16px; display:inline-flex; align-items:center; justify-content:center;\n      box-shadow:0 0 0 6px rgba(24,24,27,0.03);\n    }\n    .icon-badge img { display:inline-block; vertical-align:middle; }\n    .icon-badge-green  { background:#f0fdf4; box-shadow:0 0 0 6px rgba(34,197,94,0.06); }\n    .icon-badge-red    { background:#fef2f2; box-shadow:0 0 0 6px rgba(239,68,68,0.06); }\n    .icon-badge-amber  { background:#fffbeb; box-shadow:0 0 0 6px rgba(245,158,11,0.08); }\n    .icon-badge-indigo { background:#eef2ff; box-shadow:0 0 0 6px rgba(99,102,241,0.08); }\n    .icon-badge-purple { background:#faf5ff; box-shadow:0 0 0 6px rgba(124,58,237,0.08); }\n    .icon-badge-gray   { background:#f4f4f5; }\n    .hero .h1 { margin-bottom:0; }\n    /* ── Misc ── */\n    hr { border:none; border-top:1px solid #f4f4f5; margin:20px 0; }\n    .btn { display:block; background:#09090b; color:#fff!important; text-decoration:none; padding:13px 20px; border-radius:6px; font-size:14px; font-weight:600; text-align:center; margin-bottom:20px; }\n    .btn-indigo { background:#6366f1; }\n    .qr-wrap { display:inline-block; padding:12px; background:#fff; border:1px solid #e0e7ff; border-radius:10px; box-shadow:0 2px 10px rgba(79,70,229,0.08); }\n    /* ── Footer ── */\n    .footer { padding:16px 24px; border-top:1px solid #f4f4f5; }\n    .footer p { font-size:11px; color:#a1a1aa; text-align:center; line-height:1.7; }\n\n    /* ── Mobile ──\n       .code was the worst offender: 44px + 10px letter-spacing on an 8-char\n       code (e.g. \"FIT-0001\") runs past a ~340px content width on a phone,\n       forcing horizontal scroll inside the email. .row also needs to wrap\n       instead of squeezing a long value (email addresses especially)\n       against its label on one line. Gmail's Android/iOS apps and Apple\n       Mail both apply <style> media queries fine — only some Outlook\n       desktop builds ignore them, and this app's mail is 100% consumer\n       inboxes, not corporate Outlook. */\n    @media  screen and (max-width: 480px) {\n      .wrap { margin:20px auto; padding:0 12px 28px; }\n      .nav { padding:14px 16px; }\n      .body { padding:24px 16px; }\n      .h1 { font-size:19px; }\n      .lead { font-size:13.5px; }\n      .box { padding:16px; }\n      .code-box { padding:18px 12px; }\n      .code { font-size:24px; letter-spacing:3px; }\n      .row { flex-wrap:wrap; row-gap:2px; }\n      .rv { text-align:left; width:100%; }\n      .icon-badge { width:48px; height:48px; line-height:48px; }\n    }\n  ", "body": "\n  <div class=\"wrap\">\n    <div class=\"card\">\n      <div class=\"card-bar\"></div>\n\n      <div class=\"nav\">\n        <div class=\"nav-icon\">\n          \n          <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAS4AAAGACAYAAAATVo/dAAAQAElEQVR4nOzdeZBlZXnA4bcJYBAUt0ERFVRUlE0Ro4jBCCWLCxrcARVTJpYmRhNR0IomGrdUVDSkXOKKMSESNLiGURFIShEXwDFCUBxjIhoWcUF2ofN+3B7TDNMzdznL/e59nqp3vp6enn+g59ffOffcczYPWGZxcfEuudwx50452+TcNmerZfObS+ttgkn9POdzCwsL3w5GshDMvIzRdrnssGzunnOPpY9Xxf+HatugD3+Y8XpnMDThmiEZqBKeh+TssWx2jcGuien2gIzXd4KhbB5UKSNVDuMekbNPzsNjEKy7B7U6IEe4hiRclchQlZ3TvjGI1d45uwez5M7B0IRrSmWo7pXLY3P2X5q7B p { max-width:560px; margin:40px auto; padding:0 20px 40px; }\n    .card { background:#fff; border:1px solid #e4e4e7; border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(24,24,27,0.04), 0 12px 32px -12px rgba(79,70,229,0.18); }\n    .card-bar { height:4px; background:linear-gradient(90deg,#4F46E5,#7C3AED); }\n    /* ── Nav ── */\n    .nav { padding:20px 24px; border-bottom:1px solid #f4f4f5; display:flex; align-items:center; gap:9px; }\n    .nav-icon { width:22px; height:22px; background:linear-gradient(135deg,#4F46E5,#7C3AED); border-radius:6px; padding:3px 5px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(79,70,229,0.3); }\n    .nav-name { font-size:14.5px; font-weight:800; color:#09090b; letter-spacing:-0.3px; }\n    /* ── Body ── */\n    .body { padding:32px 24px; }\n    .eyebrow { font-size:11px; font-weight:700; color:#6366f1; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:8px; }\n    .h1 { font-size:22px; font-weight:700; color:#09090b; line-height:1.3; margin-bottom:10px; }\n    .lead { font-size:14px; color:#52525b; line-height:1.7; margin-bottom:24px; }\n    /* ── Info box ── */\n    .box { background:#fafafa; border:1px solid #e4e4e7; border-radius:6px; padding:18px 20px; margin-bottom:20px; }\n    .box-label { font-size:10px; font-weight:700; color:#a1a1aa; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }\n    .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:13px; }\n    .row:last-child { border-bottom:none; padding-bottom:0; }\n    .rk { color:#71717a; }\n    .rv { font-weight:600; color:#09090b; text-align:right; }\n    /* ── Code ── */\n    .code-box { background:linear-gradient(135deg,#eef2ff,#f5f3ff); border:1px solid #e0e7ff; border-radius:10px; padding:26px; text-align:center; margin-bottom:20px; }\n    .code { font-size:36px; font-weight:800; color:#4338ca; letter-spacing:5px; font-family:'Courier New',monospace; }\n    .code-hint { font-size:12px; color:#a1a1aa; margin-top:10px; }\n    /* ── Notices ── */\n    .notice { border-left:3px solid #e4e4e7; padding:12px 16px; margin-bottom:20px; border-radius:0 4px 4px 0; background:#fafafa; }\n    .notice p,.notice-text { font-size:13px; line-height:1.65; color:#52525b; }\n    .notice.blue   { border-color:#6366f1; background:#f5f3ff; }\n    .notice.green  { border-color:#22c55e; background:#f0fdf4; }\n    .notice.amber  { border-color:#f59e0b; background:#fffbeb; }\n    .notice.red    { border-color:#ef4444; background:#fef2f2; }\n    /* ── Pill badges ── */\n    .pill { display:inline-block; padding:2px 9px; border-radius:4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }\n    .pill-basic   { background:#f5f3ff; color:#7c3aed; border:1px solid #ddd6fe; }\n    .pill-premium { background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; }\n    .pill-vip     { background:#fffbeb; color:#d97706; border:1px solid #fde68a; }\n    .pill-green   { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }\n    .pill-red     { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }\n    .pill-icon    { width:12px; height:12px; vertical-align:-2px; margin-right:1px; }\n    /* ── Icon badge (hero icon at the top of every email) ──\n       line-height + vertical-align:middle centers the icon even in clients\n       that ignore flexbox; inline-flex centers it properly everywhere else. */\n    .hero { text-align:center; margin-bottom:22px; }\n    .icon-badge {\n      width:60px; height:60px; line-height:60px; text-align:center; border-radius:50%;\n      margin:0 auto 16px; display:inline-flex; align-items:center; justify-content:center;\n      box-shadow:0 0 0 6px rgba(24,24,27,0.03);\n    }\n    .icon-badge img { display:inline-block; vertical-align:middle; }\n    .icon-badge-green  { background:#f0fdf4; box-shadow:0 0 0 6px rgba(34,1 box-shadow:0 1px 2px rgba(24,24,27,0.04), 0 12px 32px -12px rgba(79,70,229,0.18); }\n    .card-bar { height:4px; background:linear-gradient(90deg,#4F46E5,#7C3AED); }\n    /* ── Nav ── */\n    .nav { padding:20px 24px; border-bottom:1px solid #f4f4f5; display:flex; align-items:center; gap:9px; }\n    .nav-icon { width:22px; height:22px; background:linear-gradient(135deg,#4F46E5,#7C3AED); border-radius:6px; padding:3px 5px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(79,70,229,0.3); }\n    .nav-name { font-size:14.5px; font-weight:800; color:#09090b; letter-spacing:-0.3px; }\n    /* ── Body ── */\n    .body { padding:32px 24px; }\n    .eyebrow { font-size:11px; font-weight:700; color:#6366f1; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:8px; }\n    .h1 { font-size:22px; font-weight:700; color:#09090b; line-height:1.3; margin-bottom:10px; }\n    .lead { font-size:14px; color:#52525b; line-height:1.7; margin-bottom:24px; }\n    /* ── Info box ── */\n    .box { background:#fafafa; border:1px solid #e4e4e7; border-radius:6px; padding:18px 20px; margin-bottom:20px; }\n    .box-label { font-size:10px; font-weight:700; color:#a1a1aa; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }\n    .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:13px; }\n    .row:last-child { border-bottom:none; padding-bottom:0; }\n    .rk { color:#71717a; }\n    .rv { font-weight:600; color:#09090b; text-align:right; }\n    /* ── Code ── */\n    .code-box { background:linear-gradient(135deg,#eef2ff,#f5f3ff); border:1px solid #e0e7ff; border-radius:10px; padding:26px; text-align:center; margin-bottom:20px; }\n    .code { font-size:36px; font-weight:800; color:#4338ca; letter-spacing:5px; font-family:'Courier New',monospace; }\n    .code-hint { font-size:12px; color:#a1a1aa; margin-top:10px; }\n    /* ── Notices ── */\n    .notice { border-left:3px solid #e4e4e7; padding:12px 16px; margin-bottom:20px; border-radius:0 4px 4px 0; background:#fafafa; }\n    .notice p,.notice-text { font-size:13px; line-height:1.65; color:#52525b; }\n    .notice.blue   { border-color:#6366f1; background:#f5f3ff; }\n    .notice.green  { border-color:#22c55e; background:#f0fdf4; }\n    .notice.amber  { border-color:#f59e0b; background:#fffbeb; }\n    .notice.red    { border-color:#ef4444; background:#fef2f2; }\n    /* ── Pill badges ── */\n    .pill { display:inline-block; padding:2px 9px; border-radius:4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }\n    .pill-basic   { background:#f5f3ff; color:#7c3aed; border:1px solid #ddd6fe; }\n    .pill-premium { background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; }\n    .pill-vip     { background:#fffbeb; color:#d97706; border:1px solid #fde68a; }\n    .pill-green   { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }\n    .pill-red     { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }\n    .pill-icon    { width:12px; height:12px; vertical-align:-2px; margin-right:1px; }\n    /* ── Icon badge (hero icon at the top of every email) ──\n       line-height + vertical-align:middle centers the icon even in clients\n       that ignore flexbox; inline-flex centers it properly everywhere else. */\n    .hero { text-align:center; margin-bottom:22px; }\n    .icon-badge {\n      width:60px; height:60px; line-height:60px; text-align:center; border-radius:50%;\n      margin:0 auto 16px; display:inline-flex; align-items:center; justify-content:center;\n      box-shadow:0 0 0 6px rgba(24,24,27,0.03);\n    }\n    .icon-badge img { display:inline-block; vertical-align:middle; }\n    .icon-badge-green  { background:#f0fdf4; box-shadow:0 0 0 6px rgba(34,197,94,0.06); }\n    .icon-badge-red    { background:#fef2f2; box-shadow:0 0 0 6px rgba(239,68,68,0.06); }\n    .icon-badge-amber  { background:#fffbeb; box-shadow:0 0 0 6px rgba(245,158,11,0.08); }\n    .icon-badge-indigo { background:#eef2ff; box-shadow:0 0 0 6px rgba(99,102,241,0.08); }\n    .icon-badge-purple { background:#faf5ff; box-shadow:0 0 0 6px rgba(124,58,237,0.08); }\n    .icon-badge-gray   { background:#f4f4f5; }\n    .hero .h1 { margin-bottom:0; }\n    /* ── Misc ── */\n    hr { border:none; border-top:1px solid #f4f4f5; margin:20px 0; }\n    .btn { display:block; background:#09090b; color:#fff!important; text-decoration:none; padding:13px 20px; border-radius:6px; font-size:14px; font-weight:600; text-align:center; margin-bottom:20px; }\n    .btn-indigo { background:#6366f1; }\n    .qr-wrap { display:inline-block; padding:12px; background:#fff; border:1px solid #e0e7ff; border-radius:10px; box-shadow:0 2px 10px rgba(79,70,229,0.08); }\n    /* ── Footer ── */\n    .footer { padding:16px 24px; border-top:1px solid #f4f4f5; }\n    .footer p { font-size:11px; color:#a1a1aa; text-align:center; line-height:1.7; }\n\n    /* ── Mobile ──\n       .code was the worst offender: 44px + 10px letter-spacing on an 8-char\n       code (e.g. \"FIT-0001\") runs past a ~340px content width on a phone,\n       forcing horizontal scroll inside the email. .row also needs to wrap\n       instead of squeezing a long value (email addresses especially)\n       against its label on one line. Gmail's Android/iOS apps and Apple\n       Mail both apply <style> media queries fine — only some Outlook\n       desktop builds ignore them, and this app's mail is 100% consumer\n       inboxes, not corporate Outlook. */\n    @media  screen and (max-width: 480px) {\n      .wrap { margin:20px auto; padding:0 12px 28px; }\n      .nav { padding:14px 16px; }\n      .body { padding:24px 16px; }\n      .h1 { font-size:19px; }\n      .lead { font-size:13.5px; }\n      .box { padding:16px; }\n      .code-box { padding:18px 12px; }\n      .code { font-size:24px; letter-spacing:3px; }\n      .row { flex-wrap:wrap; row-gap:2px; }\n      .rv { text-align:left; width:100%; }\n      .icon-badge { width:48px; height:48px; line-height:48px; }\n    }\n  ", "body": "\n  <div class=\"wrap\">\n    <div class=\"card\">\n      <div class=\"card-bar\"></div>\n\n      <div class=\"nav\">\n        <div class=\"nav-icon\">\n          \n          <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAS4AAAGACAYAAAATVo/dAAAQAElEQVR4nOzdeZBlZXnA4bcJYBAUt0ERFVRUlE0Ro4jBCCWLCxrcARVTJpYmRhNR0IomGrdUVDSkXOKKMSESNLiGURFIShEXwDFCUBxjIhoWcUF2ofN+3B7TDNMzdznL/e59nqp3vp6enn+g59ffOffcczYPWGZxcfEuudwx50452+TcNmerZfObS+ttgkn9POdzCwsL3w5GshDMvIzRdrnssGzunnOPpY9Xxf+HatugD3+Y8XpnMDThmiEZqBKeh+TssWx2jcGuien2gIzXd4KhbB5UKSNVDuMekbNPzsNjEKy7B7U6IEe4hiRclchQlZ3TvjGI1d45uwez5M7B0IRrSmWo7pXLY3P2X5q7BXAz4ZoSGaqtczkk58AYBGunADZIuHqUsSqv6j0554k5vxMuMYChCFfHMlYPzOVZOU+Kwat+wIiEqwMZqx1zeWYMgrVnABMRrpZkrMoFnUfEIFiPDKAxwtWwDNb9cnlZzrPDhZ/QCuFqSAarvCL4khi8KugdCdAi4ZpAxqq82fh5OX+Ss3MAnRCuMWSwyhuT/zjnheGKZ+iccI0gg/WgXI7OOTxccwW9Ea4hZLB2y+XNOY8PoHfCtREZrHK3hTfG4BXCzQKYCsK1ARms2+fyZzkvjsEdP4EpIlzryWiVVwhfk3OHAKaScC3JYJUb8r0v50EBTLW5P29TLm3I+VB++KUQLajC3IYrY7WQ86IY3C73ueFqd6jGXB4qLl3e8MEY3AIZqMxc7bjKW3Ry3pIfnheiBdWamx1XBqvcDvm9OTsGULWZD9fSswb/LufpAcyEmQ5XRmuvXE7JuWcAM2Nmz3FltI7J5ewQLZg5M7fjymCVK94/GoMb+gEzaKbCldF6VC7/HB6eCjNtZg4VM1rlPu+nh2jBzKt+x5XBKg+kODHn0ADmQtXhymjtkssnc+4XwNyo9lAxo3VYLueGaMHcqTJcGa3yZJ2Tw03+YC5VF66M1utz+UC4mwPMrWrOcZXb0OTy9zF4rD0wx6oIV0Zryxi8deeQAObe1Idr6XKHU3N+OwBiysOV0bpdDC4qfWgALJnacGW07hSDaO0RAMtMZbjKAyxi8PAK12gBtzJ1l0NktLbP5awQLWAFU7XjymjdMZczc+4bACuYmnAtPfb+jLDTAjZhKsJVnr6TyxfDiXhgCL2HK6O1RQyu03LJAzCUadhxlXtp7RcAQ+o1XLnbemMuTwmAEfQWrozWs3J5ZQCMqJdwZbQekcsJATCGzsOV0doxl8/mbBEAY+g0XEt3elidc8cAGFPXO65yePiAAJhAZ+HK3dYLcnlqAEyok3BltHbP5fgAaEDr4cpobZ3Lp8LJeKAhXey4ynmtHQOgIa2GK3dbR4Ur44GGtRaujNY9cvnbAGhYK+FaegZiedL01gHQsLZ2XK/OeXgAtKDxcOVu62G5vDYAWtJouDJa5eEbHwiAFjW943p5zm4B0KLGwpW7rR1y+fMAaFmTO67352wVAC1rJFy523pGLgcFQAcmDtfSPbaOC4CONLHjKtdsbR8AHZkoXLnbumcuLwuADk264yqHiG5XA5P7WTC0scOVu61Hhzs/QFO+GAxtkh3XOwJowosXFhbOD4Y2Vrhyt3VYLnsG8+LKnKuXzVU content:center;flex-shrink:0;margin-top:1px;\">1</div>\n      <p style=\"font-size:13px;color:#52525b;line-height:1.6;\"><strong style=\"color:#09090b;\">Ingresa a la plataforma GemaSystem</strong> — con tu usuario: powerfit_admin</p>\n    </div>\n        <div style=\"display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;\">\n      <div style=\"width:22px;height:22px;border-radius:50%;background:#6366f1;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;\">2</div>\n      <p style=\"font-size:13px;color:#52525b;line-height:1.6;\"><strong style=\"color:#09090b;\">Usa la contraseña temporal</strong> — proporcionada en este correo</p>\n    </div>\n        <div style=\"display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;\">\n      <div style=\"width:22px;height:22px;border-radius:50%;background:#6366f1;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;\">3</div>\n      <p style=\"font-size:13px;color:#52525b;line-height:1.6;\"><strong style=\"color:#09090b;\">Completa la configuración inicial</strong> — de tu gimnasio</p>\n    </div>\n      </div>\n      </div>\n\n      <div class=\"footer\">\n        <p>© 2026 GemaSystem &middot; Correo automático, no respondas a este mensaje.</p>\n              </div>\n\n    </div>\n  </div>\n"}, {"id": "trial_rejected", "label": "Prueba rechazada", "group": "Prueba gratuita", "style": "\n    * { margin:0; padding:0; box-sizing:border-box; }\n    body { background:#f4f4f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; color:#09090b; -webkit-font-smoothing:antialiased; }\n    .wrap { max-width:560px; margin:40px auto; padding:0 20px 40px; }\n    .card { background:#fff; border:1px solid #e4e4e7; border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(24,24,27,0.04), 0 12px 32px -12px rgba(79,70,229,0.18); }\n    .card-bar { height:4px; background:linear-gradient(90deg,#4F46E5,#7C3AED); }\n    /* ── Nav ── */\n    .nav { padding:20px 24px; border-bottom:1px solid #f4f4f5; display:flex; align-items:center; gap:9px; }\n    .nav-icon { width:22px; height:22px; background:linear-gradient(135deg,#4F46E5,#7C3AED); border-radius:6px; padding:3px 5px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(79,70,229,0.3); }\n    .nav-name { font-size:14.5px; font-weight:800; color:#09090b; letter-spacing:-0.3px; }\n    /* ── Body ── */\n    .body { padding:32px 24px; }\n    .eyebrow { font-size:11px; font-weight:700; color:#6366f1; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:8px; }\n    .h1 { font-size:22px; font-weight:700; color:#09090b; line-height:1.3; margin-bottom:10px; }\n    .lead { font-size:14px; color:#52525b; line-height:1.7; margin-bottom:24px; }\n    /* ── Info box ── */\n    .box { background:#fafafa; border:1px solid #e4e4e7; border-radius:6px; padding:18px 20px; margin-bottom:20px; }\n    .box-label { font-size:10px; font-weight:700; color:#a1a1aa; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }\n    .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:13px; }\n    .row:last-child { border-bottom:none; padding-bottom:0; }\n    .rk { color:#71717a; }\n    .rv { font-weight:600; color:#09090b; text-align:right; }\n    /* ── Code ── */\n    .code-box { background:linear-gradient(135deg,#eef2ff,#f5f3ff); border:1px solid #e0e7ff; border-radius:10px; padding:26px; text-align:center; margin-bottom:20px; }\n    .code { font-size:36px; font-weight:800; color:#4338ca; letter-spacing:5px; font-family:'Courier New',monospace; }\n    .code-hint { font-size:12px; color:#a1a1aa; margin-top:10px; }\n    /* ── Notices ── */\n    .notice { border-left:3px solid #e4e4e7; padding:12px 16px; margin-bottom:20px; border-radius:0 4px 4px 0; background:#fafafa; }\n    .notice p,.notice-text { font-size:13px; line-height:1.65; color:#52525b; }\n    .notice.blue   { border-color:#6366f1; background:#f5f3ff; }\n    .notice.green  { border-color:#22c55e; background:#f0fdf4; }\n    .notice.amber  { border-color:#f59e0b; background:#fffbeb; }\n    .notice.red    { border-color:#ef4444; background:#fef2f2; }\n    /* ── Pill badges ── */\n    .pill { display:inline-block; padding:2px 9px; border-radius:4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }\n    .pill-basic   { background:#f5f3ff; color:#7c3aed; border:1px solid #ddd6fe; }\n    .pill-premium { background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; }\n    .pill-vip     { background:#fffbeb; color:#d97706; border:1px solid #fde68a; }\n    .pill-green   { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }\n    .pill-red     { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }\n    .pill-icon    { width:12px; height:12px; vertical-align:-2px; margin-right:1px; }\n    /* ── Icon badge (hero icon at the top of every email) ──\n       line-height + vertical-align:middle centers the icon even in clients\n       that ignore flexbox; inline-flex centers it properly everywhere else. */\n    .hero { text-align:center; margin-bottom:22px; }\n    .icon-badge {\n      width:60px; height:60px; line-height:60px; text-align:center; border-radius:50%;\n      margin:0 auto 16px; display:inline-flex; align-items:center; justify-content:center;\n      box-shadow:0 0 0 6px rgba(24,24,27,0.03);\n    }\n    .icon-badge img { display:inline-block; vertical-align:middle; }\n    .icon-badge-green  { background:#f0fdf4; box-shadow:0 0 0 6px rgba(34,197,94,0.06); }\n    .icon-badge-red    { background:#fef2f2; box-shadow:0 0 0 6px rgba(239,68,68,0.06); }\n    .icon-badge-amber  { background:#fffbeb; box-shadow:0 0 0 6px rgba(245,158,11,0.08); }\n    .icon-badge-indigo { background:#eef2ff; box-shadow:0 0 0 6px rgba(99,102,241,0.08); }\n    .icon-badge-purple { background:#faf5ff; box-shadow:0 0 0 6px rgba(124,58,237,0.08); }\n    .icon-badge-gray   { background:#f4f4f5; }\n    .hero .h1 { margin-bottom:0; }\n    /* ── Misc ── */\n    hr { border:none; border-top:1px solid #f4f4f5; margin:20px 0; }\n    .btn { display:block; background:#09090b; color:#fff!important; text-decoration:none; padding:13px 20px; border-radius:6px; font-size:14px; font-weight:600; text-align:center; margin-bottom:20px; }\n    .btn-indigo { background:#6366f1; }\n    .qr-wrap { display:inline-block; padding:12px; background:#fff; border:1px solid #e0e7ff; border-radius:10px; box-shadow:0 2px 10px rgba(79,70,229,0.08); }\n    /* ── Footer ── */\n    .footer { padding:16px 24px; border-top:1px solid #f4f4f5; }\n    .footer p { font-size:11px; color:#a1a1aa; text-align:center; line-height:1.7; }\n\n    /* ── Mobile ──\n       .code was the worst offender: 44px + 10px letter-spacing on an 8-char\n       code (e.g. \"FIT-0001\") runs past a ~340px content width on a phone,\n       forcing horizontal scroll inside the email. .row also needs to wrap\n       instead of squeezing a long value (email addresses especially)\n       against its label on one line. Gmail's Android/iOS apps and Apple\n       Mail both apply <style> media queries fine — only some Outlook\n       desktop builds ignore them, and this app's mail is 100% consumer\n       inboxes, not corporate Outlook. */\n    @media  screen and (max-width: 480px) {\n      .wrap { margin:20px auto; padding:0 12px 28px; }\n      .nav { padding:14px 16px; }\n      .body { padding:24px 16px; }\n      .h1 { font-size:19px; }\n      .lead { font-size:13.5px; }\n      .box { padding:16px; }\n      .code-box { padding:18px 12px; }\n      .code { font-size:24px; letter-spacing:3px; }\n      .row { flex-wrap:wrap; row-gap:2px; }\n      .rv { text-align:left; width:100%; }\n      .icon-badge { width:48px; height:48px; line-height:48px; }\n    }\n  ", \n\n    <div class=\"box\">\n    <div class=\"box-label\">Motivo</div>\n    <p style=\"font-size:13px;color:#52525b;line-height:1.7;\">No pudimos verificar la información de contacto proporcionada.</p>\n  </div>\n  \n  <div class=\"notice\">\n    <p class=\"notice-text\">Si crees que esto es un error o tienes más información que pueda ayudar, escríbenos directamente a <a href=\"mailto:soporte@gemasystem.app\" style=\"color:#6366f1;text-decoration:none;\">soporte@gemasystem.app</a> y con gusto revisaremos tu caso.</p>\n  </div>\n      </div>\n\n      <div class=\"footer\">\n        <p>© 2026 GemaSystem &middot; Correo automático, no respondas a este mensaje.</p>\n              </div>\n\n    </div>\n  </div>\n"}, {"id": "user_welcome", "label": "Bienvenida de cuenta (operador)", "group": "Cuenta", "style": "\n    * { margin:0; padding:0; box-sizing:border-box; }\n    body { background:#f4f4f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; color:#09090b; -webkit-font-smoothing:antialiased; }\n    .wrap { max-width:560px; margin:40px auto; padding:0 20px 40px; }\n    .card { background:#fff; border:1px solid #e4e4e7; border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(24,24,27,0.04), 0 12px 32px -12px rgba(79,70,229,0.18); }\n    .card-bar { height:4px; background:linear-gradient(90deg,#4F46E5,#7C3AED); }\n    /* ── Nav ── */\n    .nav { padding:20px 24px; border-bottom:1px solid #f4f4f5; display:flex; align-items:center; gap:9px; }\n    .nav-icon { width:22px; height:22px; background:linear-gradient(135deg,#4F46E5,#7C3AED); border-radius:6px; padding:3px 5px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(79,70,229,0.3); }\n    .nav-name { font-size:14.5px; font-weight:800; color:#09090b; letter-spacing:-0.3px; }\n    /* ── Body ── */\n    .body { padding:32px 24px; }\n    .eyebrow { font-size:11px; font-weight:700; color:#6366f1; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:8px; }\n    .h1 { font-size:22px; font-weight:700; color:#09090b; line-height:1.3; margin-bottom:10px; }\n    .lead { font-size:14px; color:#52525b; line-height:1.7; margin-bottom:24px; }\n    /* ── Info box ── */\n    .box { background:#fafafa; border:1px solid #e4e4e7; border-radius:6px; padding:18px 20px; margin-bottom:20px; }\n    .box-label { font-size:10px; font-weight:700; color:#a1a1aa; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }\n    .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:13px; }\n    .row:last-child { border-bottom:none; padding-bottom:0; }\n    .rk { color:#71717a; }\n    .rv { font-weight:600; color:#09090b; text-align:right; }\n    /* ── Code ── */\n    .code-box { background:linear-gradient(135deg,#eef2ff,#f5f3ff); border:1px solid #e0e7ff; border-radius:10px; padding:26px; text-align:center; margin-bottom:20px; }\n    .code { font-size:36px; font-weight:800; color:#4338ca; letter-spacing:5px; font-family:'Courier New',monospace; }\n    .code-hint { font-size:12px; color:#a1a1aa; margin-top:10px; }\n    /* ── Notices ── */\n    .notice { border-left:3px solid #e4e4e7; padding:12px 16px; margin-bottom:20px; border-radius:0 4px 4px 0; background:#fafafa; }\n    .notice p,.notice-text { font-size:13px; line-height:1.65; color:#52525b; }\n    .notice.blue   { border-color:#6366f1; background:#f5f3ff; }\n    .notice.green  { border-color:#22c55e; background:#f0fdf4; }\n    .notice.amber  { border-color:#f59e0b; background:#fffbeb; }\n    .notice.red    { border-color:#ef4444; background:#fef2f2; }\n    /* ── Pill badges ── */\n    .pill { display:inline-block; padding:2px 9px; border-radius:4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }\n    .pill-basic   { background:#f5f3ff; color:#7c3aed; border:1px solid #ddd6fe; }\n    .pill-premium { background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; }\n    .pill-vip     { background:#fffbeb; color:#d97706; border:1px solid #fde68a; }\n    .pill-green   { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }\n    .pill-red     { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }\n    .pill-icon    { width:12px; height:12px; vertical-align:-2px; margin-right:1px; }\n    /* ── Icon badge (hero icon at the top of every email) ──\n       line-height + vertical-align:middle centers the icon even in clients\n       that ignore flexbox; inline-flex centers it properly everywhere else. */\n    .hero { text-align:center; margin-bottom:22px; }\n    .icon-badge {\n      width:60px; height:60px; line-height:60px; text-align:center; border-radius:50%;\n      margin:0 auto 16px; display:inline-flex; align-items:center; justify-content:center;\n      box-shadow:0 0 0 6px rgba(24,24,27,0.03);\n    }\n    .icon-badge img { display:inline-block; vertical-align:middle; }\n    .icon-badge-green  { background:#f0fdf4; box-shadow:0 0 0 6px rgba(34,197,94,0.06); }\n    .icon-badge-red    { background:#fef2f2; box-shadow:0 0 0 6px rgba(239,68,68,0.06); }\n    .icon-badge-amber  { background:#fffbeb; box-shadow:0 0 0 6px rgba(245,158,11,0.08); }\n    .icon-badge-indigo { background:#eef2ff; box-shadow:0 0 0 6px rgba(99,102,241,0.08); }\n    .icon-badge-purple { background:#faf5ff; box-shadow:0 0 0 6px rgba(124,58,237,0.08); }\n    .icon-badge-gray   { background:#f4f4f5; }\n    .hero .h1 { margin-bottom:0; }\n    /* ── Misc ── */\n    hr { border:none; border-top:1px solid #f4f4f5; margin:20px 0; }\n    .btn { display:block; background:#09090b; color:#fff!important; text-decoration:none; padding:13px 20px; border-radius:6px; font-size:14px; font-weight:600; text-align:center; margin-bottom:20px; }\n    .btn-indigo { background:#6366f1; }\n    .qr-wrap { display:inline-block; padding:12px; background:#fff; border:1px solid #e0e7ff; border-radius:10px; box-shadow:0 2px 10px rgba(79,70,229,0.08); }\n    /* ── Footer ── */\n    .footer { padding:16px 24px; border-top:1px solid #f4f4f5; }\n    .footer p { font-size:11px; color:#a1a1aa; text-align:center; line-height:1.7; }\n\n    /* ── Mobile ──\n       .code was the worst offender: 44px + 10px letter-spacing on an 8-char\n       code (e.g. \"FIT-0001\") runs past a ~340px content width on a phone,\n       forcing horizontal scroll inside the email. .row also needs to wrap\n       instead of squeezing a long value (email addresses especially)\n       against its label on one line. Gmail's Android/iOS apps and Apple\n       Mail both apply <style> media queries fine — only some Outlook\n       desktop builds ignore them, and this app's mail is 100% consumer\n       inboxes, not corporate Outlook. */\n    @media  screen and (max-width: 480px) {\n      .wrap { margin:20px auto; padding:0 12px 28px; }\n      .nav { padding:14px 16px; }\n      .body { padding:24px 16px; }\n      .h1 { font-size:19px; }\n      .lead { font-size:13.5px; }\n      .box { padding:16px; }\n      .code-box { padding:18px 12px; }\n      .code { font-size:24px; letter-spacing:3px; }\n      .row { flex-wrap:wrap; row-gap:2px; }\n      .rv { text-align:left; width:100%; }\n      .icon-badge { width:48px; height:48px; line-height:48px; }\n    }\n  ", "body": "\n  <div class=\"wrap\">\n    <div class=\"card\">\n      <div class=\"card-bar\"></div>\n\n      <div class=\"nav\">\n        <div class=\"nav-icon\">\n          \n          <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAS4AAAGACAYAAAATVo/dAAAQAElEQVR4nOzdeZBlZXnA4bcJYBAUt0ERFVRUlE0Ro4jBCCWLCxrcARVTJpYmRhNR0IomGrdUVDSkXOKKMSESNLiGURFIShEXwDFCUBxjIhoWcUF2ofN+3B7TDNMzdznL/e59nqp3vp6enn+g59ffOffcczYPWGZxcfEuudwx50452+TcNmerZfObS+ttgkn9POdzCwsL3w5GshDMvIzRdrnssGzunnOPpY9Xxf+HatugD3+Y8XpnMDThmiEZqBKeh+TssWx2jcGuien2gIzXd4KhbB5UKSNVDuMekbNPzsNjEKy7B7U6IEe4hiRclchQlZ3TvjGI1d45uwez5M7B0IRrSmWo7pXLY3P2X5q7BXAz4ZoSGaqtczkk58AYBGunADZIuHqUsSqv6j0554k5vxMuMYChCFfHMlYPzOVZOU+Kw const groupOrder = ['Miembros','Cuenta','Prueba gratuita','Facturación','Soporte'];
const byGroup = {};
ENTRIES.forEach(e => { (byGroup[e.group] ||= []).push(e); });

const sidebar = document.getElementById('sidebar');
groupOrder.filter(g => byGroup[g]).forEach(g => {
  const lbl = document.createElement('div');
  lbl.className = 'group-label';
  lbl.textContent = g;
  sidebar.appendChild(lbl);
  byGroup[g].forEach(e => {
    const btn = document.createElement('button');
    btn.className = 'item';
    btn.type = 'button';
    btn.textContent = e.label;
    btn.dataset.id = e.id;
    btn.addEventListener('click', () => select(e.id));
    sidebar.appendChild(btn);
  });
});

const emailHost = document.getElementById('emailHost');
const subjectEl = document.getElementById('subject');
let currentShadow = null;

function select(id){
  const entry = ENTRIES.find(e => e.id === id);
  if(!entry) return;
  [...sidebar.querySelectorAll('.item')].forEach(b => b.classList.toggle('active', b.dataset.id === id));
  subjectEl.textContent = entry.label + ' — GemaSystem';

  emailHost.innerHTML = '';
  const host = document.createElement('div');
  emailHost.appendChild(host);
  const shadow = host.attachShadow({ mode: 'open' });
  const style = document.createElement('style');
  style.textContent = entry.style + '.wrap{margin:0 auto;padding:24px 20px;}';
  shadow.appendChild(style);
  const wrapper = document.createElement('div');
  wrapper.innerHTML = entry.body;
  shadow.appendChild(wrapper);
  currentShadow = shadow;
  emailHost.scrollTop = 0;
}

select(ENTRIES[0].id);
</script>
